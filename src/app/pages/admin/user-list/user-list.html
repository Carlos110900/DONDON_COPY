<section class="page">
  <div class="page-header">
    <h1>Usuarios</h1>
  </div>

  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Rol</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (user of users; track user.id) {
          <tr>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td>
              <span class="badge">{{ user.role }}</span>
            </td>
            <td class="row">
              @if (user.role !== 'Administrador') {
                <button type="button" class="btn" (click)="changeRole(user)">
                  {{ user.role === 'Publicador' ? 'Degradar' : 'Promover' }}
                </button>
                <button type="button" class="btn btn-danger" (click)="suspend(user)">
                  Suspender
                </button>
              }
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
