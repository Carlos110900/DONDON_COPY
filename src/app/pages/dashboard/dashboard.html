<section class="page">
  <div class="page-header">
    <h1>Panel</h1>
    <div class="row">
      <a class="btn btn-primary" routerLink="/panel/comics/nuevo">Nuevo cómic</a>
      <a class="btn" routerLink="/panel/comics">Mis cómics</a>
      <a *appHasRole="['admin']" class="btn" routerLink="/panel/usuarios">Usuarios</a>
    </div>
  </div>

  <div class="stats">
    @for (s of stats; track s.label) {
      <article class="card">
        <strong class="stat-value">{{ s.value }}</strong>
        <span class="muted">{{ s.label }}</span>
      </article>
    }
  </div>

  <h2>Actividad reciente</h2>
  <ul class="card activity">
    @for (item of activity; track item) {
      <li>{{ item }}</li>
    }
  </ul>
</section>
