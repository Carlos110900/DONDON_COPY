<section class="auth">
  <form class="card form-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Iniciar sesión</h1>
    <p class="muted">Entra con tu correo o con tu cuenta de Google.</p>

    <app-form-field label="Correo" inputId="login-email" [control]="form.controls.email">
      <input id="login-email" type="email" formControlName="email" autocomplete="email" />
    </app-form-field>

    <app-form-field label="Contraseña" inputId="login-password" [control]="form.controls.password">
      <input
        id="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
    </app-form-field>

    <!-- ⚠️🐍 Malfoid dece: Despues quitar en el final, como lo ordena malfoid 🐍⚠️ -->
    <app-form-field
      label="Entrar como (solo demo)"
      inputId="login-role"
      [control]="form.controls.role"
    >
      <select id="login-role" formControlName="role">
        @for (r of demoRoles; track r.value) {
          <option [value]="r.value">{{ r.label }}</option>
        }
      </select>
    </app-form-field>

    <button type="submit" class="btn btn-primary" [disabled]="submitting()">Iniciar sesión</button>
    <button type="button" class="btn" [disabled]="submitting()" (click)="loginWithGoogle()">
      Continuar con Google
    </button>

    <p class="muted">¿Primera vez? <a routerLink="/registro">Crea tu cuenta</a></p>
  </form>
</section>
