<section class="auth">
  <form class="card form-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Iniciar sesión</h1>
    <p class="muted">Entra con tu correo o con tu cuenta de Google.</p>

    @if (sessionExpired()) {
      <p class="alert" role="alert">Tu sesión expiró o ya no es válida. Inicia sesión de nuevo.</p>
    }
    @if (submitError(); as message) {
      <p class="alert" role="alert">{{ message }}</p>
    }

    <app-form-field label="Correo" inputId="login-email" [control]="form.controls.email">
      <input id="login-email" type="email" formControlName="email" autocomplete="email" />
    </app-form-field>

    <app-form-field label="Contraseña" inputId="login-password" [control]="form.controls.password">
      <input
        id="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
    </app-form-field>

    <button type="submit" class="btn btn-primary" [disabled]="submitting()">
      {{ submitting() ? 'Entrando…' : 'Iniciar sesión' }}
    </button>

    <p class="muted divider">o</p>
    <div #googleButton class="google-button"></div>

    <p class="muted">¿Primera vez? <a routerLink="/registro">Crea tu cuenta</a></p>
  </form>
</section>
