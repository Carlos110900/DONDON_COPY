<section class="auth">
  <form class="card form-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Crear cuenta</h1>
    <p class="muted">Elige cómo quieres que te veamos.</p>

    @if (submitError(); as message) {
      <p class="alert" role="alert">{{ message }}</p>
    }

    <app-form-field label="Nombre o nickname" inputId="reg-name" [control]="form.controls.name">
      <input id="reg-name" type="text" formControlName="name" autocomplete="nickname" />
    </app-form-field>

    <app-form-field label="Correo" inputId="reg-email" [control]="form.controls.email">
      <input id="reg-email" type="email" formControlName="email" autocomplete="email" />
    </app-form-field>

    <app-form-field label="Contraseña" inputId="reg-password" [control]="form.controls.password">
      <input
        id="reg-password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
      />
    </app-form-field>

    <app-form-field
      label="Repetir contraseña"
      inputId="reg-confirm"
      [control]="form.controls.confirm"
    >
      <input
        id="reg-confirm"
        type="password"
        formControlName="confirm"
        autocomplete="new-password"
      />
    </app-form-field>

    <app-form-field
      [control]="form.controls.accepted"
      [messages]="{ required: 'Debes aceptar las condiciones para continuar.' }"
    >
      <label class="check">
        <input type="checkbox" formControlName="accepted" />
        Estoy de acuerdo con las condiciones de uso
      </label>
    </app-form-field>

    <button type="submit" class="btn btn-primary" [disabled]="submitting()">
      {{ submitting() ? 'Creando cuenta…' : 'Aceptar y crear cuenta' }}
    </button>

    <p class="muted">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </form>
</section>
