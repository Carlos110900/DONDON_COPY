<section class="comic-list">
  <h1 class="page-title">Cómics</h1>

  @if (store.isLoading()) {
    <app-data-state kind="loading" message="Cargando cómics…" />
  } @else if (store.status() === 'error') {
    <app-data-state
      kind="error"
      [message]="store.error()?.message ?? ''"
      [retryable]="true"
      (retry)="store.load(true)"
    />
  } @else if (view().total === 0) {
    <app-data-state
      kind="empty"
      [message]="
        store.comics().length === 0
          ? 'Aún no hay cómics publicados.'
          : 'No hay cómics que coincidan con la búsqueda.'
      "
    />
  } @else {
    <div class="comic-grid">
      @for (comic of view().items; track comic.id) {
        <app-comic-card [comic]="comic" />
      }
    </div>
    <app-pagination
      [page]="view().page"
      [totalPages]="view().totalPages"
      (pageChange)="page.set($event)"
    />
  }
</section>
