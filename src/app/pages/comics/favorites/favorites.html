<section class="comic-list">
  <h1 class="page-title">Mis favoritos</h1>

  @if (store.isLoading()) {
    <app-data-state kind="loading" message="Cargando favoritos…" />
  } @else if (store.status() === 'error') {
    <app-data-state
      kind="error"
      [message]="store.error()?.message ?? ''"
      [retryable]="true"
      (retry)="store.load(true)"
    />
  } @else if (view().total === 0) {
    <app-data-state
      kind="empty"
      message="Aún no tienes cómics favoritos. Toca el corazón en cualquier cómic para guardarlo."
    />
  } @else {
    <div class="comic-grid">
      @for (comic of view().items; track comic.id) {
        <app-comic-card [comic]="comic" />
      }
    </div>
    <app-pagination
      [page]="view().page"
      [totalPages]="view().totalPages"
      (pageChange)="page.set($event)"
    />
  }
</section>
