@if (loading()) {
  <app-data-state kind="loading" message="Cargando capítulo…" />
} @else if (error(); as err) {
  <app-data-state
    kind="error"
    [message]="err.isNotFound ? 'Cómic no encontrado.' : err.message"
    [retryable]="!err.isNotFound"
    (retry)="reload()"
  >
    <a class="link" routerLink="/catalogo">Volver a la lista</a>
  </app-data-state>
} @else if (comic(); as c) {
  @if (chapter(); as ch) {
    <section class="reader">
      <header class="toolbar">
        <a class="link" [routerLink]="['/comics', c.id]">Volver a {{ c.title }}</a>
        <span class="current">{{ ch.label }}</span>
        <div class="pager">
          @if (previous(); as prev) {
            <a class="link" [routerLink]="['/comics', c.id, 'leer', prev.number]">Anterior</a>
          }
          @if (next(); as nxt) {
            <a class="link" [routerLink]="['/comics', c.id, 'leer', nxt.number]">Siguiente</a>
          }
        </div>
      </header>

      <app-pdf-viewer class="viewer" [url]="ch.pdfUrl" [title]="c.title + ' - ' + ch.label" />
    </section>
  } @else {
    <app-data-state kind="empty" message="Capítulo no encontrado.">
      <a class="link" [routerLink]="['/comics', c.id]">Volver al cómic</a>
    </app-data-state>
  }
}
